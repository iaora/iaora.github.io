<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Name</title>
  <meta name="description" content="Your Name – short one-line description of what you do.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #e8eef3;
      --ink: #13203a;
      --muted: #4a5a73;
      --accent: #2a55d9;
      --photo-bg: #c9d6e3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101a2c;
        --ink: #e8eef7;
        --muted: #a3b2c9;
        --accent: #8fb0ff;
        --photo-bg: #1d2c47;
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 3rem 1.5rem;
      background: var(--bg);
      color: var(--ink);
      font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
      font-size: 1.2rem;
      line-height: 1.65;
    }

    main {
      width: 100%;
      max-width: 62rem;
      display: grid;
      grid-template-columns: minmax(0, 20rem) minmax(0, 1fr);
      gap: clamp(2rem, 6vw, 5rem);
      align-items: end;
    }

    /* The photo sits in an arch shape – the one distinctive element on the page */
    .photo {
      aspect-ratio: 4 / 5;
      border-radius: 50% 50% 0.75rem 0.75rem / 38% 38% 0.75rem 0.75rem;
      background: var(--photo-bg);
      overflow: hidden;
      display: grid;
      place-items: center;
    }
    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .photo .initials {
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      font-weight: 800;
      font-size: 5rem;
      color: var(--accent);
    }

    h1 {
      margin: 0 0 1.25rem;
      font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-weight: 800;
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      line-height: 0.98;
      letter-spacing: -0.03em;
    }

    .bio {
      max-width: 34rem;
      margin: 0 0 1.75rem;
      color: var(--muted);
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.5rem;
      margin: 0;
      padding: 0;
      list-style: none;
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      font-weight: 600;
      font-size: 1.05rem;
    }
    .links a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 0.25em;
      text-decoration-thickness: 2px;
    }
    .links a:hover { text-decoration-thickness: 4px; }
    a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
      border-radius: 2px;
    }

    @media (max-width: 720px) {
      main { grid-template-columns: 1fr; }
      .photo { max-width: 16rem; }
    }
  </style>
</head>
<body>
  <main>
    <div class="photo">
      <!-- Replace photo.jpg with your own picture (same folder as this file) -->
      <img src="photo.jpg" alt="Portrait of Your Name"
           onerror="this.remove(); this.parentNode.insertAdjacentHTML('beforeend','<span class=&quot;initials&quot; aria-hidden=&quot;true&quot;>YN</span>');">
    </div>

    <div>
      <h1>Your Name</h1>
      <p class="bio">
        I’m a [your role] based in [your city]. I like building [the kind of work you do],
        and I’m currently focused on [what you’re working on or learning].
        Outside of work, you’ll find me [a hobby or two].
      </p>
      <ul class="links">
        <li><a href="mailto:you@example.com">Email</a></li>
        <li><a href="https://github.com/your-username">GitHub</a></li>
        <li><a href="https://www.linkedin.com/in/your-username">LinkedIn</a></li>
      </ul>
    </div>
  </main>
</body>
</html>
